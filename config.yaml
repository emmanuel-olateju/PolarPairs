experiment:
  name: "subtask2 cross-lingual training"
  version: "v2.0"
  dir: "./experiments/v2.0"
  baseline: "v2.0"
  description: "Baseline performance of cross-lingual training on subtask2"
  author: Emmanuel Olateju
  date: 05-02-2026
  messages:
    - using LEALLA-base
    - no early-stopping and model-checkpointing
    - no data augmentations

languages:
  - "swa"
  - "hau"
  - "eng"
  - "amh"

models:
  slave_model: "setu4993/LEALLA-base"
  anchor_model: "sentence-transformers/LaBSE"
  freeze_slave_n_layers: 0
  freeze_anchor_n_layers: 0

training:
  lr: !!float 2e-5
  batch_size: 16  
  n_epochs: 10
  
  TNCSE:
    alpha: 0.05
    beta: 1
    gamma: 0.01
    temperature: 0.1

n_labels:
  subtask1: 2
  subtask2: 5
  subtask3: 6

minority_classes:
  subtask2:
   - "gender/sexual"
   - "other"
  subtask3:
   - 'invalidation' 
   - 'lack_of_empathy' 
   - 'dehumanization'

augmentations:
  - "aeda"
  - "wordswap"
  - "backtranslate"